# Standalone cloud configuration; do not overlay local development credentials.
name: netpulse-cloud
x-runtime: &runtime
  image: ${APP_IMAGE:?Set APP_IMAGE to an immutable image tag or digest}
  env_file: /opt/netpulse/runtime.env
  restart: unless-stopped
  init: true
  stop_grace_period: 40s
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  sqlproxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
    profiles: [sqlproxy]
    command: [--private-ip, --address=0.0.0.0, --port=5432, "${SQL_CONNECTION_NAME:-}"]
    restart: unless-stopped
  migrate:
    <<: *runtime
    command: [/app/migrate]
    restart: 'no'
  api:
    <<: *runtime
    command: [/app/api]
    mem_limit: 512m
    cpus: 1
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck: {test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/readyz'], interval: 15s, timeout: 5s, retries: 10}
  worker:
    <<: *runtime
    command: [/app/worker]
    mem_limit: 1g
    cpus: 1
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck: {test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8081/readyz'], interval: 15s, timeout: 5s, retries: 10}
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE}
    restart: unless-stopped
    mem_limit: 128m
    depends_on: {api: {condition: service_healthy}}
  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment: {DOMAIN: '${DOMAIN:?Set your DNS name}'}
    ports: ['80:80','443:443']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', caddy-data:/data, caddy-config:/config]
    depends_on: [web]
volumes:
  caddy-data:
  caddy-config:
