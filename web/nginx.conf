server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
 location /api/ { proxy_pass http://api:8080; proxy_read_timeout 35s; proxy_set_header Host $host; }
 location / { try_files $uri $uri/ /index.html; }
}
